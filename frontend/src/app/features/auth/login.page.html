<form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h1>Đăng nhập Smart Mall</h1>

  @if (error()) {
    <div class="alert alert-error">{{ error() }}</div>
  }

  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <span class="error">Vui lòng nhập email hợp lệ</span>
    }
  </div>

  <div class="field">
    <label for="password">Mật khẩu</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <span class="error">Vui lòng nhập mật khẩu</span>
    }
  </div>

  <button class="btn" type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
  </button>

  <p class="switch muted">
    Khách thuê chưa có tài khoản? <a routerLink="/register">Đăng ký</a>
  </p>
</form>
