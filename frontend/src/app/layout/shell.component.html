<div class="shell">
  <aside class="sidebar">
    <div class="brand">Smart Mall</div>
    <nav>
      @for (item of navItems(); track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      @if (auth.currentUser(); as user) {
        <span class="user">
          {{ user.fullName }}
          <span class="badge">{{ roleLabels[user.role] }}</span>
        </span>
      }
      <button type="button" class="btn btn-ghost" (click)="auth.logout()">Đăng xuất</button>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
