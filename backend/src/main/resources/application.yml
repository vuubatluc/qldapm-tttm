spring:
  application:
    name: smartmall
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartmall}
    username: ${DB_USERNAME:smartmall}
    password: ${DB_PASSWORD:smartmall}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Schema chỉ thay đổi qua Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Ho_Chi_Minh

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: smartmall
    access-token-ttl: 2h
    refresh-token-ttl: 7d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
