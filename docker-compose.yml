# Chạy toàn bộ hệ thống:  docker compose up -d --build
#   Frontend : http://localhost:${FRONTEND_PORT}
#   Backend  : http://localhost:${BACKEND_PORT}/swagger-ui.html
#   Postgres : localhost:${POSTGRES_PORT}
# Chỉ chạy CSDL để dev FE/BE ngoài Docker:  docker compose up -d postgres
#
# Cấu hình đọc từ file .env (copy từ .env.example). Giá trị sau dấu ":-" là mặc định cho máy dev.

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartmall-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-smartmall}
      POSTGRES_USER: ${DB_USERNAME:-smartmall}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartmall}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-smartmall} -d ${DB_NAME:-smartmall}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: smartmall-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-smartmall}
      DB_USERNAME: ${DB_USERNAME:-smartmall}
      DB_PASSWORD: ${DB_PASSWORD:-smartmall}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET - copy .env.example thành .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-Smartmall@123}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: smartmall-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  pgdata:
